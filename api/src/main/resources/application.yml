spring:
  application.name: cocos-challenge-api
  flyway:
    # The compose file and the tests turn it on; the API never migrates by itself
    enabled: false
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: database.sql de Cocos
    group: true
  jackson.deserialization:
    fail-on-unknown-properties: true
    accept-float-as-int: false
  mvc.problemdetails.enabled: true
  messages.fallback-to-system-locale: false
cocos:
  display:
    time-zone: America/Argentina/Buenos_Aires
    locale: es-AR
