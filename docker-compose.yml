name: cocos-challenge

services:
  postgres:
    image: postgres:18
    environment:
      # Local copy only: this password protects nothing real.
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./docs/00-fuentes/database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      # Over the network (-h): while loading database.sql the image runs a temporary local-only server.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

  api:
    build: ./api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      # Same local-only password as above.
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_FLYWAY_ENABLED: "true"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
