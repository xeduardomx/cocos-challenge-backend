name: cocos-challenge

services:
  postgres:
    image: postgres:18
    environment:
      # Local copy only: this password protects nothing real.
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./docs/00-fuentes/database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      # Over the network (-h): while loading database.sql the image runs a temporary local-only server.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

  api:
    build: ./api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The local copy unless scripts/run-on-neon.sh says otherwise.
      SPRING_DATASOURCE_URL: ${API_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/postgres}
      SPRING_DATASOURCE_USERNAME: ${API_DATASOURCE_USERNAME:-postgres}
      # Same local-only password as above.
      SPRING_DATASOURCE_PASSWORD: ${API_DATASOURCE_PASSWORD:-postgres}
      SPRING_FLYWAY_ENABLED: ${API_FLYWAY_ENABLED:-true}
      # How recent an equal accepted order makes a new one a possible duplicate (RFC 5.5). 0s turns the check off.
      COCOS_ORDERS_DUPLICATES_WINDOW: ${DUPLICATE_ORDER_WINDOW:-5s}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

  prometheus:
    image: prom/prometheus:v3.16.0
    depends_on:
      - api
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # Not a volume: the image would leave an anonymous one behind after `down`. Every `up` starts empty.
    tmpfs:
      - /prometheus:uid=65534,gid=65534
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:13.3.0
    depends_on:
      - prometheus
    environment:
      # No login, read only, and only on this machine: Grafana has no authentication here.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/cocos-api.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    tmpfs:
      # exec: Grafana runs its bundled plugins (the Prometheus one) from this folder, and a tmpfs is noexec by default.
      - /var/lib/grafana:exec,uid=472,gid=0
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
